<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zombie Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700&family=Pirata+One&family=Silkscreen&display=swap">
<style>
/* Zombie Garage — estética: hierro, hueso y sangre seca, luz de vela. Un solo tema oscuro deliberado. */
:root {
  --bg: #0b080c;
  --panel: #151016;
  --panel-2: #1d161d;
  --line: #3a2a2c;
  --bone: #e6d9bf;
  --bone-dim: #a39682;
  --blood: #b3202a;
  --blood-dark: #5e0f18;
  --gold: #d9a441;
  --rust: #8a4a2a;
  --ok: #7fae5a;
  --font-display: 'Pirata One', 'UnifrakturCook', Georgia, serif;
  --font-pixel: 'Silkscreen', 'Courier New', monospace;
  --font-body: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--bone); font-family: var(--font-body); font-size: 15px; }
body { padding-inline: 16px; padding-block: 12px 32px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#app { max-width: 1280px; margin: 0 auto; display: grid; gap: 10px; }

.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--bone); letter-spacing: 0.02em; margin: 0; text-shadow: 0 2px 0 var(--blood-dark); }
.brand span { color: var(--blood); }
.topbar .spacer { flex: 1; }
.tb-btn { background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; font-family: var(--font-pixel); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 2px; }
.tb-btn:hover { border-color: var(--bone-dim); }
.tb-btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tb-btn.go { background: var(--blood); border-color: #e0404a; color: #fff3e8; }
.tb-btn.go:disabled { background: var(--panel); color: var(--bone-dim); border-color: var(--line); cursor: default; }

/* Escenario: la tira de la barra de tareas */
#stage { position: relative; width: 100%; aspect-ratio: 4 / 1; max-width: 100%; background: #000; border: 1px solid #000; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(0,0,0,0.6); overflow: hidden; }
#screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-pixel); font-size: clamp(9px, 1.2vw, 13px); text-shadow: 1px 1px 0 #000, 0 0 6px #000; }
.hud .tl, .hud .tr, .hud .bl { position: absolute; display: flex; gap: 14px; align-items: center; }
.hud .tl { top: 6%; left: 1.5%; }
.hud .tr { top: 6%; right: 1.5%; }
.hud .bl { top: 20%; left: 1.5%; }
#stage.rtl .hud .tl { left: auto; right: 1.5%; }
#stage.rtl .hud .tr { right: auto; left: 1.5%; }
#stage.rtl .hud .bl { left: auto; right: 1.5%; }
.money { color: var(--gold); }
.kills { color: var(--bone); }
.zone-name { font-family: var(--font-display); font-size: 1.5em; color: var(--bone); }
.meter { display: grid; gap: 2px; width: clamp(60px, 10vw, 130px); }
.meter label { font-size: 0.75em; color: var(--bone-dim); }
.meter .bar { height: 5px; background: rgba(0,0,0,0.6); border: 1px solid rgba(230,217,191,0.25); }
.meter .fill { height: 100%; background: var(--blood); transition: width 0.15s linear; }
.meter.fuel .fill { background: var(--gold); }
.perks { display: flex; gap: 6px; color: #9ad0ff; }

.banner { position: absolute; left: 0; right: 0; top: 16%; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.35s; }
.banner.show { opacity: 1; }
.banner .t { font-family: var(--font-display); font-size: clamp(18px, 3.6vw, 44px); color: var(--bone); letter-spacing: 0.03em; text-shadow: 0 2px 0 #000, 0 0 18px rgba(0,0,0,0.9); }
.banner.horde .t { color: #ff5a4a; }
.banner.perk .t { color: #9ad0ff; font-size: clamp(14px, 2.4vw, 28px); }
.banner.rival .t { color: var(--gold); font-size: clamp(14px, 2.4vw, 28px); }
.banner .s { font-family: var(--font-pixel); font-size: clamp(8px, 1vw, 12px); color: var(--bone-dim); margin-top: 2px; text-shadow: 1px 1px 0 #000; }

.deathcard { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
.deathcard.show { opacity: 1; }
.deathcard .w { font-family: var(--font-display); font-size: clamp(28px, 7vw, 92px); color: var(--blood); line-height: 0.9; letter-spacing: 0.04em; text-shadow: 0 3px 0 #000, 0 0 30px rgba(0,0,0,0.95); }
.deathcard .s { font-family: var(--font-pixel); font-size: clamp(8px, 1.1vw, 13px); color: var(--bone); text-shadow: 1px 1px 0 #000; }

/* Mapa de progreso */
.track { position: relative; height: 34px; border: 1px solid var(--line); background: var(--panel); }
.track .seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--line); font-family: var(--font-pixel); font-size: 9px; color: var(--bone-dim); padding: 3px 5px; overflow: hidden; white-space: nowrap; }
.track .mark { position: absolute; top: 14px; width: 2px; height: 18px; transform: translateX(-1px); }
.track .mark.rival { background: var(--bone-dim); height: 10px; top: 22px; }
.track .mark.rival.beaten { background: #4a4048; }
.track .mark.best { background: var(--gold); }
.track .mark.last { background: #6a6070; }
.track .mark.car { background: var(--blood); width: 6px; height: 6px; top: 22px; border-radius: 50%; transform: translateX(-3px); box-shadow: 0 0 6px var(--blood); }
.track-note { font-family: var(--font-pixel); font-size: 10px; color: var(--bone-dim); }

/* Panel del garaje */
.panel { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 10px; }
@media (max-width: 760px) { .panel { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); padding: 12px; min-width: 0; }
.preview-wrap { display: grid; gap: 10px; }
#preview { width: 100%; image-rendering: pixelated; background: #120c10; border: 1px solid var(--line); display: block; }
.stat { display: grid; grid-template-columns: 90px 1fr 70px; gap: 8px; align-items: center; font-size: 13px; }
.stat .name { color: var(--bone-dim); }
.stat .sbar { height: 6px; background: #0c080c; border: 1px solid #2a2024; position: relative; }
.stat .sbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bone-dim); }
.stat .sbar b { position: absolute; top: 0; bottom: 0; background: var(--ok); }
.stat .sbar b.neg { background: var(--blood); }
.stat .val { font-family: var(--font-pixel); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
.stat .val em { font-style: normal; color: var(--ok); }
.stat .val em.neg { color: var(--blood); }
.lock { font-family: var(--font-pixel); font-size: 11px; color: var(--gold); border: 1px dashed var(--rust); padding: 8px; }

.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 12px; font-family: var(--font-display); font-size: 20px; color: var(--bone-dim); }
.tabs button[aria-selected="true"] { color: var(--bone); border-bottom-color: var(--blood); }
.tabs .badge { font-family: var(--font-pixel); font-size: 10px; background: var(--blood); color: #fff; padding: 0 4px; margin-left: 4px; vertical-align: 3px; }

.taller { display: grid; grid-template-columns: minmax(160px, 220px) 1fr; gap: 10px; }
@media (max-width: 560px) { .taller { grid-template-columns: 1fr; } }
.slots { display: grid; gap: 4px; align-content: start; }
.slot { text-align: left; background: var(--panel-2); border: 1px solid var(--line); padding: 6px 8px; display: grid; gap: 1px; }
.slot small { font-family: var(--font-pixel); font-size: 9px; color: var(--bone-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.slot[aria-pressed="true"] { border-color: var(--blood); background: #22141a; }
.parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; align-content: start; }
.part { background: var(--panel-2); border: 1px solid var(--line); padding: 10px; display: grid; gap: 6px; min-width: 0; }
.part.equipped { border-color: var(--gold); }
.part h4 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 400; line-height: 1.05; }
.part p { margin: 0; color: var(--bone-dim); font-size: 13px; line-height: 1.35; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--font-pixel); font-size: 9px; background: #0c080c; border: 1px solid #2a2024; padding: 1px 5px; }
.pips { display: flex; gap: 2px; }
.pips i { width: 8px; height: 4px; background: #2a2024; }
.pips i.on { background: var(--gold); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn { background: #241a1e; border: 1px solid #4a3438; padding: 5px 9px; font-family: var(--font-pixel); font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; }
.btn:hover:not(:disabled) { border-color: var(--bone-dim); }
.btn.buy { background: var(--blood-dark); border-color: var(--blood); }
.btn:disabled { opacity: 0.45; cursor: default; }
.tag { font-family: var(--font-pixel); font-size: 9px; color: var(--gold); text-transform: uppercase; }

.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { display: grid; gap: 4px; justify-items: center; background: var(--panel-2); border: 1px solid var(--line); padding: 8px; width: 110px; }
.swatch .c { width: 46px; height: 18px; border: 1px solid #000; }
.swatch[aria-pressed="true"] { border-color: var(--gold); }
.swatch span { font-size: 12px; text-align: center; }

.list { display: grid; gap: 6px; }
.obj { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; }
.obj .pbar { grid-column: 1 / -1; height: 4px; background: #0c080c; }
.obj .pbar i { display: block; height: 100%; background: var(--gold); }
.obj.done { opacity: 0.5; }
.rank { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; padding: 6px 10px; background: var(--panel-2); border: 1px solid var(--line); align-items: center; }
.rank.you { border-color: var(--blood); background: #22141a; }
.rank .n { font-family: var(--font-pixel); color: var(--bone-dim); }
.rank .d { font-family: var(--font-pixel); font-size: 12px; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.kv b { font-family: var(--font-pixel); font-weight: 400; font-size: 12px; text-align: right; }
h3 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0 0 8px; }
.hint { color: var(--bone-dim); font-size: 13px; margin: 0; }

@media (prefers-reduced-motion: reduce) { .banner, .deathcard { transition: none; } }

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1 class="brand">Zombie <span>Garage</span></h1>
    <div class="spacer"></div>
    <button class="tb-btn" id="btn-dir" type="button" title="Sentido de la tira">Izq → Der</button>
    <button class="tb-btn" id="btn-auto" type="button" aria-pressed="true">Salida automática</button>
    <button class="tb-btn" id="btn-panel" type="button" aria-pressed="true">Garaje</button>
    <button class="tb-btn go" id="btn-go" type="button">A la carretera</button>
  </div>

  <div id="stage">
    <canvas id="screen" width="512" height="128"></canvas>
    <div class="hud">
      <div class="tl"><span class="money" id="hud-money">$0</span><span class="kills" id="hud-kills"></span><span class="perks" id="hud-perks"></span></div>
      <div class="tr"><span id="hud-dist"></span><span class="zone-name" id="hud-zone"></span></div>
      <div class="bl">
        <div class="meter"><label>Aguante</label><div class="bar"><div class="fill" id="hud-hp"></div></div></div>
        <div class="meter fuel"><label>Gasolina</label><div class="bar"><div class="fill" id="hud-fuel"></div></div></div>
      </div>
    </div>
    <div class="banner" id="banner"><div class="t"></div><div class="s"></div></div>
    <div class="deathcard" id="deathcard"><div class="w"></div><div class="s"></div></div>
  </div>

  <div class="track" id="track"></div>
  <div class="track-note" id="track-note"></div>

  <section class="panel" id="panel">
    <div class="card preview-wrap">
      <canvas id="preview" width="112" height="40"></canvas>
      <div id="stats"></div>
      <div id="lock"></div>
    </div>
    <div class="card">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="tab-body"></div>
    </div>
  </section>
</div>
<script>
'use strict';
// Utilidades compartidas: resolución, aleatoriedad, color, dithering y contorno de sprites.
window.ZG = window.ZG || {};
(function (Z) {
  Z.W = 512;          // resolución interna (tira tipo barra de tareas)
  Z.H = 128;
  Z.PXM = 4;          // píxeles por metro
  Z.ROAD_TOP = 98;
  Z.GROUND = 114;     // línea donde apoyan las ruedas del coche
  Z.CAR_X = 96;       // posición en pantalla del coche
  Z.LW = 1024;        // ancho de las capas de fondo (se repiten)

  Z.rng = function (seed) {
    let s = (seed >>> 0) || 1;
    return function () {
      s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
      return s / 4294967296;
    };
  };
  Z.rr = (a, b) => a + Math.random() * (b - a);
  Z.ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  Z.pick = (arr, r) => arr[Math.floor((r ? r() : Math.random()) * arr.length)];
  Z.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  Z.lerp = (a, b, t) => a + (b - a) * t;
  Z.wpick = function (weights) { // {clave: peso}
    let tot = 0; for (const k in weights) tot += weights[k];
    let r = Math.random() * tot;
    for (const k in weights) { r -= weights[k]; if (r <= 0) return k; }
    return Object.keys(weights)[0];
  };

  Z.canvas = function (w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.imageSmoothingEnabled = false;
    return [c, x];
  };

  Z.rgb = function (hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  Z.hex = function (r, g, b) {
    return '#' + ((1 << 24) | (Z.clamp(r | 0, 0, 255) << 16) | (Z.clamp(g | 0, 0, 255) << 8) | Z.clamp(b | 0, 0, 255)).toString(16).slice(1);
  };
  Z.mix = function (a, b, t) {
    const A = Z.rgb(a), B = Z.rgb(b);
    return Z.hex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  };
  Z.rgba = function (hex, a) { const c = Z.rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; };

  Z.BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];

  // Degradado vertical con tramado ordenado (sin colores intermedios, estilo pixel art).
  Z.ditherV = function (ctx, x0, y0, w, h, stops) {
    const id = ctx.getImageData(x0, y0, w, h), d = id.data;
    const cols = stops.map(Z.rgb), n = cols.length - 1;
    for (let y = 0; y < h; y++) {
      const t = (y / Math.max(1, h - 1)) * n;
      const i = Math.min(n - 1, Math.floor(t)), f = t - i;
      for (let x = 0; x < w; x++) {
        const c = (f * 16 > Z.BAYER[y & 3][x & 3] + 0.5) ? cols[i + 1] : cols[i];
        const k = (y * w + x) * 4;
        d[k] = c[0]; d[k + 1] = c[1]; d[k + 2] = c[2]; d[k + 3] = 255;
      }
    }
    ctx.putImageData(id, x0, y0);
  };

  // Contorno oscuro de 1px + luz de borde en el lado izquierdo (los faros del coche).
  Z.outline = function (c, rimHex, rimAmt, outHex) {
    const x = c.getContext('2d'), w = c.width, h = c.height;
    const id = x.getImageData(0, 0, w, h), d = id.data, src = new Uint8ClampedArray(d);
    const out = Z.rgb(outHex || '#07050c');
    const rim = rimHex ? Z.rgb(rimHex) : null;
    const A = (i, j) => (i < 0 || j < 0 || i >= w || j >= h) ? 0 : src[(j * w + i) * 4 + 3];
    for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
      const k = (y * w + i) * 4;
      if (src[k + 3] === 0) {
        if (A(i - 1, y) || A(i + 1, y) || A(i, y - 1) || A(i, y + 1)) { d[k] = out[0]; d[k + 1] = out[1]; d[k + 2] = out[2]; d[k + 3] = 255; }
      } else if (rim && (!A(i - 1, y) || !A(i, y - 1))) {
        const t = !A(i - 1, y) ? rimAmt : rimAmt * 0.5;
        d[k] += (rim[0] - d[k]) * t; d[k + 1] += (rim[1] - d[k + 1]) * t; d[k + 2] += (rim[2] - d[k + 2]) * t;
      }
    }
    x.putImageData(id, 0, 0);
  };

  // Silueta de un color (para destello al recibir golpe).
  Z.silhouette = function (c, color) {
    const [s, x] = Z.canvas(c.width, c.height);
    x.drawImage(c, 0, 0);
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
    return s;
  };

  // Primitivas de píxel.
  Z.px = function (ctx, x, y, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
  Z.rect = function (ctx, x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
  Z.line = function (ctx, x0, y0, x1, y1, w, c) {
    ctx.fillStyle = c;
    const dx = x1 - x0, dy = y1 - y0;
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) * 1.4));
    const o = (w - 1) / 2;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      ctx.fillRect(Math.round(x0 + dx * t - o), Math.round(y0 + dy * t - o), w, w);
    }
  };
  Z.disc = function (ctx, cx, cy, r, c) {
    ctx.fillStyle = c;
    for (let y = -Math.ceil(r); y <= Math.ceil(r); y++) for (let x = -Math.ceil(r); x <= Math.ceil(r); x++) {
      if (x * x + y * y <= r * r) ctx.fillRect(Math.round(cx + x), Math.round(cy + y), 1, 1);
    }
  };

  Z.fmt = function (n) {
    n = Math.floor(n);
    if (n < 1000) return '' + n;
    const u = ['K', 'M', 'B', 'T'];
    let i = -1;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + u[i];
  };

  // Fuente bitmap 3x5 para números flotantes (+$12, x2...).
  const GLYPH = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111',
    '4': '101101111001001', '5': '111100111001111', '6': '111100111101111', '7': '111001010010010',
    '8': '111101111101111', '9': '111101111001111', '+': '000010111010000', '$': '011110010011110',
    'K': '101110100110101', 'M': '101111111101101', 'B': '110101110101110', 'x': '000101010101000',
    '.': '000000000000010', '-': '000000111000000', '!': '010010010000010', 'm': '000110111101101',
  };
  Z.pixText = function (ctx, str, x, y, color, shadow) {
    let cx = Math.round(x);
    y = Math.round(y);
    for (const ch of str) {
      const g = GLYPH[ch];
      if (g) {
        for (let i = 0; i < 15; i++) if (g[i] === '1') {
          const gx = cx + (i % 3), gy = y + ((i / 3) | 0);
          if (shadow) { ctx.fillStyle = shadow; ctx.fillRect(gx + 1, gy + 1, 1, 1); }
          ctx.fillStyle = color; ctx.fillRect(gx, gy, 1, 1);
        }
      }
      cx += 4;
    }
  };
  Z.pixTextW = (str) => str.length * 4 - 1;
})(window.ZG);

</script>
<script>
'use strict';
// Datos de diseño: zonas, zombis, piezas, mejoras, objetivos y rivales.
(function (Z) {
  Z.ZONES = [
    { id: 'afueras', name: 'Las Afueras', sub: 'Donde empezó todo', start: 0, hp: 1, dmg: 1, money: 1, density: 1,

// Sprites procedurales: zombis y conductor (marionetas pixeladas), ruedas y coches compuestos.
(function (Z) {

  // ---------- Marioneta humanoide (mira a la izquierda) ----------
  function humanoid(ctx, o) {
    const s = o.s || 1, p = o.phase * Math.PI * 2, C = o.col;
    const legL = o.leg * s, T = legL / 2, SH = legL / 2;
    const lw = Math.max(1, Math.round(o.limbW * s)), aw = Math.max(1, Math.round(o.armW * s));
    const moving = o.mode === 'walk' || o.mode === 'run';
    const bob = moving ? Math.abs(Math.cos(p)) * (o.mode === 'run' ? 1.2 : 0.8) * s : (o.mode === 'attack' ? Math.abs(Math.sin(p * 2)) * 0.6 : 0);
    const lean = o.lean + (o.mode === 'attack' ? 0.15 : 0);
    const hipX = o.cx, hipY = o.gy - legL * 0.95 + bob;

    function leg(off, colB, boot) {
      let a, bend;
      if (o.mode === 'attack') { a = off ? 0.32 : -0.22; bend = 0.25; }
      else if (o.mode === 'idle') { a = off ? 0.08 : -0.06; bend = 0.05; }
      else { a = Math.sin(p + off) * o.stride; bend = Math.max(0, Math.sin(p + off + Math.PI / 2)) * o.stride * 1.5; }
      const kx = hipX - Math.sin(a) * T, ky = hipY + Math.cos(a) * T;
      const b = a - bend;
      const fx = kx - Math.sin(b) * SH, fy = Math.min(o.gy, ky + Math.cos(b) * SH);
      Z.line(ctx, hipX, hipY, kx, ky, lw, colB);
      Z.line(ctx, kx, ky, fx, fy, lw, colB);
      Z.rect(ctx, fx - 1 - (lw > 1 ? 1 : 0), fy, lw + 1, 1, boot);
    }
    const TL = o.torso * s;
    const shX = hipX - Math.sin(lean) * TL, shY = hipY - Math.cos(lean) * TL;
    const UA = o.UA * s, FA = o.FA * s;

    function arm(k, col, back) {
      let ex, ey, hx, hy;
      if (o.arms === 'swing' && o.mode !== 'attack') {
        const a = Math.sin(p + k) * 1.1;
        ex = shX - Math.sin(a) * UA; ey = shY + 1 + Math.cos(a) * UA;
        const b = a + 1.1;
        hx = ex - Math.sin(b) * FA; hy = ey + Math.cos(b) * FA;
      } else if (o.arms === 'hang' && o.mode !== 'attack') {
        const a = 0.2 + Math.sin(p + k) * 0.3;
        ex = shX - Math.sin(a) * UA; ey = shY + 1 + Math.cos(a) * UA;
        const b = a + 0.25;
        hx = ex - Math.sin(b) * FA; hy = ey + Math.cos(b) * FA;
      } else {
        let a;
        if (o.mode === 'attack') a = -0.55 + Math.sin(p * 2 + k * 1.7) * 0.75;
        else if (o.mode === 'idle') a = 1.2;
        else a = -0.05 + Math.sin(p + k) * 0.18;
        ex = shX - Math.cos(a) * UA; ey = shY + 1 + Math.sin(a) * UA;
        const b = a + 0.2 + Math.sin(p * 0.5 + k) * 0.12;
        hx = ex - Math.cos(b) * FA; hy = ey + Math.sin(b) * FA;
      }

      Z.line(ctx, ex, ey, hx, hy, aw, back ? C.skinD : C.skin);
      if (!back && o.claws) Z.px(ctx, hx - 1, hy, C.skinD);
    }

    // Brazo y pierna del fondo (más oscuros), torso, pierna, cabeza y brazo delanteros.
    if (!o.noBackArm) arm(Math.PI, C.topD, true);
    leg(Math.PI, C.bottomD, '#0e0c10');
    Z.line(ctx, hipX, hipY, shX, shY, Math.max(1, Math.round(o.torsoW * s)), C.top);
    const tw = Math.max(1, Math.round(o.torsoW * s));
    Z.line(ctx, hipX + Math.floor(tw / 2), hipY - 1, shX + Math.floor(tw / 2), shY + 1, 1, C.topD);

    Z.rect(ctx, hipX - Math.floor(tw / 2), hipY - 1, tw, 2, C.bottom);
    leg(0, C.bottom, '#16121a');

    const hw = Math.round(o.headW * s), hh = Math.round(o.headH * s);
    const hx = Math.round(shX - hw / 2 - 1 - lean * 2), hy = Math.round(shY - hh + (o.mode === 'attack' ? 1 : 0));
    Z.rect(ctx, hx + 1, hy + hh - 1, Math.max(1, hw - 2), 2, C.skinD); // cuello
    Z.rect(ctx, hx, hy, hw, hh, o.helmet ? C.helmet : C.skin);

      if (C.eye) { Z.px(ctx, hx, hy + 1, C.eye); if (s > 1.2) Z.px(ctx, hx + 1, hy + 1, C.eye); }

      Z.rect(ctx, sx, sy, 2, Math.round(12 * s), C.shield);
      Z.rect(ctx, sx, sy, 1, Math.round(12 * s), '#7a88aa');
      Z.rect(ctx, sx, sy + 5, 2, 1, '#c8b860');

    const dark = Z.rgb('#3a3640'), spoke = Z.rgb('#a8a4b2'), hub = Z.rgb('#c8c4d0');
    const tc = Z.rgb('#18161c'), tcl = Z.rgb('#34303c'), stud = Z.rgb('#c8ccd6');

        for (let k = 0; k < 8; k++) if (Math.abs(Math.sin(ang - rot - k * Math.PI / 4)) * dd < 0.6 && Math.cos(ang - rot - k * Math.PI / 4) > 0) col = stud;

  // Construye el sprite compuesto del coche con sus piezas estáticas.
  Z.buildCar = function (eq, paintId, decalId) {
    const A = Z.CHASSIS_ART[eq.chasis];
    const paint = Z.PAINTS.find(p => p.id === paintId) || Z.PAINTS[0];
    const map = A.map, mh = map.length, mw = Math.max(...map.map(r => r.length));
    const cell = (x, y) => (y < 0 || y >= mh) ? '.' : (map[y][x] || '.');

    const W = mw + OX + 30, H = mh + A.r + OY + 4;
    const [cv, ctx] = Z.canvas(W, H);
    const base = paint.base, matte = A.matte || Z.mix(base, '#100c14', 0.6);
    const tone = (c) => ({ L2: Z.mix(c, '#f4ecff', 0.45), L1: Z.mix(c, '#b8c0ff', 0.18), B: c, D1: Z.mix(c, '#1a0c28', 0.35), D2: Z.mix(c, '#0a0410', 0.6) });

    for (let x = 0; x < mw; x++) {
      top[x] = -1; bot[x] = -1;
      for (let y = 0; y < mh; y++) if (isBody(cell(x, y)) || cell(x, y) === 'W') { if (top[x] < 0) top[x] = y; bot[x] = y; }
    }
    const bodyPx = [], glassPx = [];
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
      const ch = cell(x, y); if (ch === '.') continue;
      const above = cell(x, y - 1), below = cell(x, y + 1);
      let col;
      if (ch === 'B' || ch === 'M' || ch === 'Y') {
        const T = ch === 'B' ? TB : ch === 'M' ? TM : TY;
        const f = (y - top[x]) / Math.max(1, bot[x] - top[x] + 1);
        const dz = (x + y) & 1;
        if (!isBody(above) && above !== 'W') col = T.L2;
        else if (above === 'W') col = T.L1;
        else if (f < 0.28) col = T.L1;
        else if (f < 0.4) col = dz ? T.L1 : T.B;
        else if (f < 0.6) col = T.B;
        else if (f < 0.72) col = dz ? T.B : T.D1;
        else if (f < 0.88) col = T.D1;
        else col = T.D2;
        bodyPx.push([x + OX, y + OY]);
      } else if (ch === 'S') col = Z.mix(base, '#05030a', 0.55);
      else if (ch === 'C') col = above !== 'C' ? '#dcd8e4' : below !== 'C' ? '#4a4655' : '#8a8696';
      else if (ch === 'L') col = '#fff4c8';
      else if (ch === 'R') col = (x + y) & 1 ? '#c01c2c' : '#ff5050';
      else if (ch === 'W') {
        col = above !== 'W' ? '#2e3a5c' : ((x + y) % 8 < 2 ? '#3e4c78' : '#141a30');
        glassPx.push([x + OX, y + OY]);

    }

    for (const [wx, wy] of A.wheels) {
      for (let y = wy - A.r - 3; y < mh; y++) for (let x = wx - A.r - 3; x <= wx + A.r + 3; x++) {
        const dd = Math.hypot(x - wx, y - wy);
        if (dd <= A.r + 1.4 && isBody(cell(x, y))) Z.rect(ctx, x + OX, y + OY, 1, 1, dd > A.r + 0.6 ? '#2a2230' : '#0c0910');

      canvas: cv, W, H, OX, OY, mw, mh, r: A.r, paint,
      wheels: A.wheels.map(P), front: P(A.front), roof: P(A.roof), hood: P(A.hood), rear: P(A.rear), driver: P(A.driver),

    for (const w of art.windows) {
      let x = w[0] + Math.floor(rnd() * w[2]), y = w[1];

        art.cracks.push([x, y]);
        x += rnd() < 0.5 ? 1 : -1; y += rnd() < 0.6 ? 1 : 0;
        if (y >= w[1] + w[3] || x < w[0] || x >= w[0] + w[2]) { x = w[0] + Math.floor(rnd() * w[2]); y = w[1]; }
      }
    }
    art.wheelFrames = Z.wheelFrames(A.r + (eq.ruedas === 'militares' ? 1 : 0), eq.ruedas);
    return art;
  };

  function drawDecal(ctx, art, id, paint) {

    const fp = profile(rnd, 90, [[3, 2], [8, 1]]);
    fillProfile(x, fp, '#060a08', '#1a3a1e');
    L.push({ c, f: 0.06, lights: [{ x: 637, y: 52, type: 'glow', color: '#ff2a2a', r: 16 }] });
    [c, x] = Z.canvas(LW, H);
    for (let i = 10; i < LW; i += 14 + Math.floor(rnd() * 30)) {
      const h = 6 + Math.floor(rnd() * 8);
      Z.rect(x, i, 92 - h, 1, h, '#0a120c'); Z.rect(x, i - 2, 92 - h + 2, 5, 1, '#0a120c');
    }
    const ip = profile(rnd, 92, [[4, 1.5]]);
    fillProfile(x, ip, '#08100a', '#1e3a20');
    L.push({ c, f: 0.24 });

    for (let i = 60; i < LW; i += 170 + Math.floor(rnd() * 60)) {
      Z.rect(x, i, 50, 2, 46, '#070a08'); Z.rect(x, i, 50, 16, 2, '#070a08'); Z.rect(x, i + 13, 52, 1, 8, '#2a2a20');
      Z.rect(x, i + 10, 60, 7, 9, '#141810'); for (let k = 0; k < 7; k += 2) Z.rect(x, i + 10 + k, 60, 1, 9, '#3a3a2a');
      Z.rect(x, i + 12, 64, 3, 4, '#3a3a30');

  };

  const CACHE = [];
  Z.zoneArt = function (i) {
    i = Math.min(i, BUILD.length - 1);

      const [rt, rx] = Z.canvas(64, H - Z.ROAD_TOP);
      const rr = Z.rng(i * 7 + 3);
      Z.rect(rx, 0, 0, 64, H, a.road.base);
      for (let k = 0; k < 260; k++) Z.px(rx, Math.floor(rr() * 64), Math.floor(rr() * 30), Z.pick(a.road.noise, rr));
      for (let k = 0; k < 4; k++) { const cx = Math.floor(rr() * 60), cy = 4 + Math.floor(rr() * 22); for (let j = 0; j < 6; j++) Z.px(rx, cx + j, cy + (j % 3 === 0 ? 1 : 0), Z.mix(a.road.base, '#000', 0.4)); }

      }

  // Dibuja el fondo de una zona. alpha permite el fundido entre zonas.
  Z.drawBackdrop = function (ctx, zi, camX, t, alpha, lightsOut, night) {
    const a = Z.zoneArt(zi);

    }
    for (const L of a.layers) {

  };

  // ---------------- Garaje ----------------
  let GAR = null;
  function buildGarage() {
    const rnd = Z.rng(99);
    const [c, x] = Z.canvas(W, H);
    // pared de ladrillo
    Z.rect(x, 0, 0, W, H, '#140e12');

    }

    Z.rect(x, 0, 100, W, 1, '#3a3234');

    for (let i = 0; i < 9; i++) { const tx = 34 + i * 7; Z.rect(x, tx, 34 + (i % 3) * 2, 1, 10 + (i % 4) * 3, '#8a8a96'); Z.rect(x, tx - 1, 34 + (i % 3) * 2, 3, 2, '#5a5a66'); }
    Z.rect(x, 36, 54, 22, 6, '#7a1a1a'); Z.rect(x, 62, 52, 30, 8, '#4a4a54');
    // neumáticos apilados
    for (let i = 0; i < 4; i++) { Z.rect(x, 116, 100 - (i + 1) * 6, 18, 6, '#141216'); Z.rect(x, 117, 100 - (i + 1) * 6, 16, 1, '#2a2830'); Z.rect(x, 122, 102 - (i + 1) * 6, 6, 2, '#0a090c'); }
    // altar con velas (toque gótico)
    Z.rect(x, 150, 70, 26, 30, '#1a1014'); Z.rect(x, 150, 70, 26, 1, '#3a2a2a');
    Z.rect(x, 160, 52, 6, 14, '#2a1a10'); Z.rect(x, 157, 56, 12, 2, '#2a1a10');
    Z.rect(x, 159, 62, 8, 6, '#c8b8a0'); Z.px(x, 160, 64, '#140a0a'); Z.px(x, 164, 64, '#140a0a');
    for (const cx of [153, 157, 168, 172]) Z.rect(x, cx, 66, 2, 4 + (cx % 3), '#d8c8a8');
    // puerta enrollable (salida)
    Z.rect(x, 440, 28, 72, 72, '#2a2c34');
    for (let y = 30; y < 100; y += 3) Z.rect(x, 440, y, 72, 1, '#1a1c22');
    Z.rect(x, 436, 24, 4, 76, '#0e0e12'); Z.rect(x, 436, 24, 76, 4, '#0e0e12');
    // cartel
    Z.rect(x, 230, 8, 60, 12, '#1a1012'); Z.rect(x, 231, 9, 58, 10, '#2a1418');
    // ascensor hidráulico
    Z.rect(x, 200, 104, 120, 3, '#4a4a52'); Z.rect(x, 200, 104, 120, 1, '#8a8a96');
    Z.rect(x, 214, 107, 4, 14, '#2a2a30'); Z.rect(x, 302, 107, 4, 14, '#2a2a30');
    GAR = { c };
  }
  Z.drawGarage = function (ctx, t, lightsOut, doorOpen) {
    if (!GAR) buildGarage();
    ctx.drawImage(GAR.c, 0, 0);
    // letrero de neón
    const on = Math.sin(t * 17) > -0.8 || Math.sin(t * 2.3) > 0;
    ctx.font = '8px monospace';
    if (on) { lightsOut.push({ x: 260, y: 14, r: 34, color: '#ff2a3a', a: 0.22 }); }
    // velas
    for (const cx of [154, 158, 169, 173]) {
      const fy = 64 - (cx % 3) - 1 + (Math.sin(t * 11 + cx) > 0 ? 0 : 1);
      Z.px(ctx, cx, fy, '#ffd070'); Z.px(ctx, cx, fy - 1, '#ff8a30');
      lightsOut.push({ x: cx, y: fy, r: 10 + Math.sin(t * 9 + cx) * 2, color: '#ff9a40', a: 0.12 });
    }
    // lámpara colgante que se balancea
    const sw = Math.sin(t * 1.3) * 0.12, lx = 260 + Math.sin(sw) * 34, ly = 2 + Math.cos(sw) * 34;
    Z.line(ctx, 260, 0, lx, ly, 1, '#0a0a0c');
    Z.rect(ctx, lx - 4, ly, 9, 3, '#2a2a30'); Z.rect(ctx, lx - 1, ly + 3, 3, 1, '#fff0c0');
    ctx.fillStyle = 'rgba(255,220,150,0.04)';
    ctx.beginPath(); ctx.moveTo(lx - 3, ly + 3); ctx.lineTo(lx + 3, ly + 3); ctx.lineTo(lx + 70, 104); ctx.lineTo(lx - 70, 104); ctx.fill();
    lightsOut.push({ x: lx, y: ly + 6, r: 90, color: '#ffd8a0', a: 0.28 });
    // puerta
    if (doorOpen > 0) {
      const hgt = Math.round(72 * doorOpen);
      Z.ditherV(ctx, 440, 28 + 72 - hgt, 72, hgt, ['#0c0f28', '#22214a', '#6a3a52']);
      Z.rect(ctx, 440, 28 + 72 - hgt - 1, 72, 1, '#4a4c58');
      lightsOut.push({ x: 476, y: 90, r: 40 * doorOpen, color: '#8a90ff', a: 0.25 });

    Z.pixText(ctx, on ? 'ZG' : '', 254, 11, '#ff4a5a');

<script>
'use strict';
// Partículas, restos en la carretera, luces y clima.
(function (Z) {
  const BLOOD = ['#5a0812', '#7a0e18', '#9a1420', '#c0202c', '#4a0610'];

  Z.BLOOD = BLOOD;

  Z.FX = {
    parts: [], decals: [],
    reset() { this.parts.length = 0; this.decals.length = 0; },
    add(p) { if (this.parts.length < 1400) this.parts.push(p); return p; },

    blood(x, y, n, vx, ground, palette) {
      const pal = palette || BLOOD;
      for (let i = 0; i < n; i++) this.add({ k: 'drop', x: x + Z.rr(-3, 3), y: y + Z.rr(-4, 4), vx: vx * Z.rr(0.2, 1.1) + Z.rr(-35, 35), vy: Z.rr(-110, -10), g: 300, life: 2, c: Z.pick(pal), gy: ground + Z.rr(-3, 3), stick: Math.random() < 0.8 });
    },
    sparks(x, y, n, vx) {
      for (let i = 0; i < n; i++) this.add({ k: 'spark', x, y, vx: (vx || 0) + Z.rr(-60, 60), vy: Z.rr(-90, -10), g: 260, life: Z.rr(0.15, 0.45), max: 0.45 });
    },
    smoke(x, y, n, dark) {
      for (let i = 0; i < n; i++) this.add({ k: 'smoke', x: x + Z.rr(-2, 2), y, vx: Z.rr(-14, 4), vy: Z.rr(-22, -10), g: 0, life: Z.rr(0.8, 1.6), max: 1.6, s: Z.rr(1, 2), c: dark ? '#141016' : '#4a4652' });
    },
    fire(x, y, n, spread) {
      for (let i = 0; i < n; i++) this.add({ k: 'fire', x: x + Z.rr(-spread, spread), y: y + Z.rr(-1, 1), vx: Z.rr(-12, 8), vy: Z.rr(-40, -16), g: 0, life: Z.rr(0.2, 0.5), max: 0.5 });
    },
    embers(x, y, n) {
      for (let i = 0; i < n; i++) this.add({ k: 'ember', x, y, vx: Z.rr(-20, 20), vy: Z.rr(-50, -15), g: -4, life: Z.rr(0.8, 2), max: 2 });
    },
    glass(x, y, n) {
      for (let i = 0; i < n; i++) this.add({ k: 'drop', x, y, vx: Z.rr(-40, 60), vy: Z.rr(-80, -20), g: 300, life: 2, c: Z.pick(['#a8c0f0', '#e0ecff', '#6a80b8']), gy: Z.GROUND + Z.rr(-2, 6), stick: true });
    },
    debris(x, y, n, cols) {
      for (let i = 0; i < n; i++) this.add({ k: 'chunk', x, y, vx: Z.rr(-80, 120), vy: Z.rr(-150, -40), g: 320, life: 3, c: Z.pick(cols), s: Z.ri(1, 3), gy: Z.GROUND + Z.rr(-3, 8), bounce: 1 });
    },
    // Destripar a un zombi: sangre, trozos, cabeza que sale volando y cuerpo que cae.
    gore(z, vx, col, big) {
      const y = z.y - (big ? 16 : 11);
      this.blood(z.wx, y, big ? 50 : 26, vx, z.y, z.type === 'bloater' ? ACID.concat(BLOOD) : null);
      for (let i = 0; i < (big ? 8 : 4); i++) this.add({ k: 'chunk', x: z.wx, y: y + Z.rr(-3, 4), vx: vx * Z.rr(0.4, 1) + Z.rr(-30, 30), vy: Z.rr(-130, -40), g: 300, life: 3, c: Z.pick([col.top, col.skin, col.bottom, '#7a0e18']), s: big ? 3 : 2, gy: z.y + Z.rr(-2, 2), bounce: 1 });
      if (Math.random() < 0.7) this.add({ k: 'head', x: z.wx, y: y - 6, vx: vx * Z.rr(0.5, 1.1) + Z.rr(-10, 30), vy: Z.rr(-150, -70), g: 300, life: 3, c: col.helmet || col.skin, h: col.hair, s: big ? 4 : 3, gy: z.y + Z.rr(-2, 2), bounce: 1 });
      this.add({ k: 'body', x: z.wx, y: y, vx: vx * Z.rr(0.35, 0.7), vy: Z.rr(-80, -30), g: 300, life: 3, col, big, gy: z.y, spin: Z.rr(8, 16) });
    },
    explosion(x, y, scale) {
      for (let i = 0; i < 14 * scale; i++) this.add({ k: 'ball', x: x + Z.rr(-10, 10) * scale, y: y + Z.rr(-8, 4) * scale, vx: Z.rr(-30, 30), vy: Z.rr(-40, -5), g: -10, life: Z.rr(0.5, 1.1), max: 1.1, s: Z.rr(4, 9) * scale });
      this.add({ k: 'ring', x, y, life: 0.45, max: 0.45, s: 60 * scale });

      this.embers(x, y, 30);
    },

    update(dt) {
      const P = this.parts;
      for (let i = P.length - 1; i >= 0; i--) {
        const p = P[i];
        p.life -= dt;
        if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt; }
        if (p.k === 'smoke') { p.s += dt * 3; p.vx *= 0.98; }
        if (p.gy !== undefined && p.y >= p.gy && p.vy > 0) {
          if (p.bounce && Math.abs(p.vy) > 60) { p.vy *= -0.35; p.vx *= 0.5; p.y = p.gy; p.bounce--; continue; }
          if (p.k === 'drop') { if (p.stick) this.decals.push({ x: p.x, y: Math.round(p.gy), c: p.c, w: Math.random() < 0.3 ? 2 : 1 }); }
          else if (p.k === 'chunk') this.decals.push({ x: p.x, y: Math.round(p.gy), c: p.c, w: p.s });
          else if (p.k === 'head') this.decals.push({ x: p.x, y: Math.round(p.gy) - 1, c: p.c, w: 3, h: 2, hair: p.h });
          else if (p.k === 'body') { this.decals.push({ x: p.x, y: Math.round(p.gy), corpse: p.col, big: p.big }); for (let k = 0; k < 6; k++) this.decals.push({ x: p.x + Z.rr(-8, 8), y: Math.round(p.gy) + Z.ri(-1, 1), c: Z.pick(BLOOD), w: 2 }); }
          else if (p.k === 'wheel') { p.vy *= -0.4; p.vx *= 0.6; p.y = p.gy; if (Math.abs(p.vy) < 20) p.life = Math.min(p.life, 1.5); continue; }
          P.splice(i, 1); continue;
        }
        if (p.life <= 0) P.splice(i, 1);
      }
      if (this.decals.length > 2400) this.decals.splice(0, this.decals.length - 2400);
    },

    drawDecals(ctx, camX) {
      const D = this.decals;
      for (let i = D.length - 1; i >= 0; i--) {
        const d = D[i], sx = Math.round(d.x - camX);
        if (sx < -40) { if (camX > 0) D.splice(i, 1); continue; }
        if (sx > Z.W + 40) continue;
        if (d.corpse) Z.drawCorpse(ctx, sx, d.y, d.corpse, d.big, d.flip);
        else { Z.rect(ctx, sx, d.y, d.w, d.h || 1, d.c); if (d.hair) Z.px(ctx, sx + 2, d.y, d.hair); }
      }
    },

    draw(ctx, camX, lights) {
      for (const p of this.parts) {
        const sx = p.x - camX, sy = p.y;
        if (sx < -60 || sx > Z.W + 60) continue;

          case 'drop': Z.px(ctx, sx, sy, p.c); break;
          case 'chunk': Z.rect(ctx, sx, sy, p.s, p.s, p.c); break;
          case 'head': Z.rect(ctx, sx, sy, p.s, p.s, p.c); Z.rect(ctx, sx, sy, p.s, 1, p.h || '#111'); Z.px(ctx, sx, sy + p.s, '#9a1420'); break;
          case 'body': {
            const a = (p.life * p.spin) % Math.PI;
            const len = p.big ? 12 : 8, dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
            Z.line(ctx, sx - dx, sy - dy, sx, sy, 2, p.col.bottom); Z.line(ctx, sx, sy, sx + dx, sy + dy, 2, p.col.top);
            Z.px(ctx, sx + dx, sy + dy, p.col.skin);
            break;
          }
          case 'spark': Z.px(ctx, sx, sy, p.life > 0.25 ? '#fff4b0' : p.life > 0.12 ? '#ffb040' : '#c04a10'); break;
          case 'smoke': ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.5; Z.rect(ctx, sx - p.s / 2, sy - p.s / 2, p.s, p.s, p.c); ctx.globalAlpha = 1; break;
          case 'fire': {
            const f = p.life / p.max;
            Z.rect(ctx, sx, sy, f > 0.5 ? 2 : 1, f > 0.5 ? 2 : 1, f > 0.7 ? '#fff0a0' : f > 0.4 ? '#ffa030' : '#c03a10');
            break;
          }
          case 'ember': Z.px(ctx, sx, sy, Math.sin(p.life * 20) > 0 ? '#ffb040' : '#ff6020'); break;
          case 'ball': {
            const f = p.life / p.max, r = p.s * (1.2 - f * 0.5);
            Z.disc(ctx, sx, sy, r, f > 0.75 ? '#fff6c8' : f > 0.5 ? '#ffb040' : f > 0.3 ? '#c84a18' : '#3a2a2a');
            if (f > 0.4) lights.push({ x: sx, y: sy, r: r * 4, color: '#ff8a30', a: 0.4 * f });
            break;
          }
          case 'ring': {
            const f = 1 - p.life / p.max, r = p.s * f;
            ctx.strokeStyle = Z.rgba('#ffe0a0', 0.6 * (1 - f)); ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(Math.round(sx), Math.round(sy), r, 0, Math.PI * 2); ctx.stroke();
            break;
          }
          case 'tracer': {
            ctx.strokeStyle = Z.rgba('#ffe8a0', Math.min(1, p.life / 0.05)); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(Math.round(sx) + 0.5, Math.round(sy) + 0.5); ctx.lineTo(Math.round(p.x2 - camX) + 0.5, Math.round(p.y2) + 0.5); ctx.stroke();
            break;
          }
          case 'flash': {
            Z.disc(ctx, sx, sy, p.s, '#fff4c0'); Z.disc(ctx, sx + 1, sy, p.s * 0.5, '#ffffff');
            lights.push({ x: sx, y: sy, r: 30, color: '#ffd080', a: 0.6 });
            break;
          }
          case 'wheel': {
            ctx.drawImage(p.img, Math.round(sx - p.img.width / 2), Math.round(sy - p.img.height / 2));
            break;
          }
        }
      }
    },
  };

  // Luces aditivas (faros, fogonazos, fuegos).
  Z.drawLights = function (ctx, lights) {
    ctx.globalCompositeOperation = 'lighter';
    for (const l of lights) {
      if (l.r <= 0) continue;
      const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
      g.addColorStop(0, Z.rgba(l.color, l.a));
      g.addColorStop(1, Z.rgba(l.color, 0));
      ctx.fillStyle = g;
      ctx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
  };

  let VIG = null;
  Z.vignette = function (ctx) {
    if (!VIG) {
      const [c, x] = Z.canvas(Z.W, Z.H);
      const g = x.createRadialGradient(Z.W / 2, Z.H * 0.55, Z.H * 0.4, Z.W / 2, Z.H * 0.55, Z.W * 0.62);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(4,2,8,0.75)');
      x.fillStyle = g; x.fillRect(0, 0, Z.W, Z.H);
      VIG = c;
    }
    ctx.drawImage(VIG, 0, 0);
  };

  // Clima en espacio de pantalla.
  Z.Weather = {
    drops: [], motes: [], bolt: null, boltT: 0, nextBolt: 8,
    update(dt, kind, zoneArt, speed) {
      if (kind === 'tormenta') {
        while (this.drops.length < 140) this.drops.push({ x: Math.random() * (Z.W + 60), y: Math.random() * Z.H, v: Z.rr(180, 260) });
        for (const d of this.drops) { d.y += d.v * dt; d.x -= (d.v * 0.25 + speed * 0.5) * dt; if (d.y > Z.H || d.x < -4) { d.y = -4; d.x = Math.random() * (Z.W + 60); } }
        this.nextBolt -= dt; this.boltT -= dt;
        if (this.nextBolt <= 0) {
          this.nextBolt = Z.rr(5, 13); this.boltT = 0.35;
          const pts = []; let x = Z.rr(160, 480), y = 0;
          while (y < 70) { pts.push([x, y]); x += Z.rr(-8, 8); y += Z.rr(4, 9); }
          this.bolt = pts;
          return 'flash';
        }
      } else this.drops.length = 0;
      const wantMotes = zoneArt && (zoneArt.ash || zoneArt.dust) ? 60 : 0;
      while (this.motes.length < wantMotes) this.motes.push({ x: Math.random() * Z.W, y: Math.random() * Z.H, v: Z.rr(6, 16), ph: Math.random() * 6 });
      if (this.motes.length > wantMotes) this.motes.length = wantMotes;
      for (const m of this.motes) {
        m.ph += dt; m.y += m.v * dt * (zoneArt.dust ? 0.3 : 1); m.x -= (speed * 0.4 + (zoneArt.dust ? 30 : 4)) * dt + Math.sin(m.ph) * 0.1;
        if (m.y > Z.H) m.y = 0; if (m.x < 0) m.x += Z.W;
      }
      return null;
    },
    draw(ctx, zoneArt) {
      for (const d of this.drops) { Z.rect(ctx, d.x, d.y, 1, 3, 'rgba(150,170,220,0.45)'); if (d.y > Z.ROAD_TOP + 6 && Math.random() < 0.05) Z.px(ctx, d.x, d.y + 2, '#a8b8e0'); }
      if (zoneArt) for (const m of this.motes) Z.px(ctx, m.x, m.y, zoneArt.dust ? 'rgba(230,170,110,0.6)' : 'rgba(170,170,160,0.55)');
      if (this.boltT > 0 && this.bolt) {
        ctx.strokeStyle = this.boltT > 0.2 ? '#ffffff' : '#a8b8ff'; ctx.lineWidth = 1;
        ctx.beginPath(); this.bolt.forEach(([x, y], i) => i ? ctx.lineTo(x + 0.5, y + 0.5) : ctx.moveTo(x + 0.5, y + 0.5)); ctx.stroke();
      }
    },
  };
})(window.ZG);
